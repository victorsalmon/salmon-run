name: salmon-run tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pester:
    name: Pester suite
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Tests
        shell: pwsh
        run: |
          $env:PSModulePath = "${{ github.workspace }}\Modules;" + $env:PSModulePath
          # Some windows-2025 runners are provisioned without PSGallery registered,
          # so ensure the default gallery is available before installing Pester.
          if (-not (Get-PSRepository -Name PSGallery -ErrorAction SilentlyContinue)) {
            Register-PSRepository -Default
            Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          }
          $pester = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -ge [version]'6.0.0' } | Select-Object -First 1
          if (-not $pester) {
            Install-Module Pester -MinimumVersion 6.0.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Invoke-Pester -Path 'Tests' -Output Detailed

      - name: Leak check
        shell: pwsh
        run: |
          .\scripts\Invoke-LeakCheck.ps1

  release:
    name: GitHub release archive
    needs: pester
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release archive
        id: archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          ARCHIVE="salmon-run-${VERSION}"
          TMP_DIR=$(mktemp -d)
          # Exclude the private .git metadata and any stray runtime home.
          # Build the archives outside the workspace so tar/zip do not try to
          # pack the files they are writing.
          tar --exclude='.git' --exclude='.salmon' \
              -czf "${TMP_DIR}/${ARCHIVE}.tar.gz" -C "${GITHUB_WORKSPACE}" .
          cd "${GITHUB_WORKSPACE}"
          zip -r "${TMP_DIR}/${ARCHIVE}.zip" . -x '*.git*' -x '*.salmon*'
          mv "${TMP_DIR}/${ARCHIVE}.tar.gz" "${GITHUB_WORKSPACE}/"
          mv "${TMP_DIR}/${ARCHIVE}.zip" "${GITHUB_WORKSPACE}/"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify archive contents
        shell: bash
        run: |
          tar -tzf "salmon-run-${{ steps.archive.outputs.version }}.tar.gz" | grep -E '^\./(install\.ps1|Modules/|docs/|dot-salmon\.example/)' > /tmp/archive-list.txt
          head -n 20 /tmp/archive-list.txt

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.archive.outputs.version }}"
          gh release create "${VERSION}" \
            --title "salmon-run ${VERSION}" \
            --notes "Automated release archive for ${VERSION}." \
            "salmon-run-${VERSION}.tar.gz" \
            "salmon-run-${VERSION}.zip"
