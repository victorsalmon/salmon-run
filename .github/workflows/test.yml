name: salmon-run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pester:
    name: Pester suite
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PowerShell 7
        uses: bjompen/powershell-action@v2
        with:
          run: |
            $PSVersionTable.PSVersion
            Install-Module Pester -MinimumVersion 6.0.0 -Force -SkipPublisherCheck

      - name: Run Orchestrator/Tests
        shell: pwsh
        run: |
          $env:PSModulePath = "${{ github.workspace }}\Orchestrator\Modules;${{ github.workspace }}\Skills\Docker\Modules;" + $env:PSModulePath
          Invoke-Pester -Path 'Orchestrator/Tests' -Output Detailed

      - name: Run Skills/Docker/Tests
        shell: pwsh
        run: |
          $env:PSModulePath = "${{ github.workspace }}\Orchestrator\Modules;${{ github.workspace }}\Skills\Docker\Modules;" + $env:PSModulePath
          Invoke-Pester -Path 'Skills/Docker/Tests' -Output Detailed

      - name: Leak check
        shell: pwsh
        run: |
          .\scripts\Invoke-LeakCheck.ps1
