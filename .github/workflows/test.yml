name: salmon-run tests

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pester:
    name: Pester suite
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PowerShell 7
        uses: bjompen/powershell-action@v2
        with:
          run: |
            $PSVersionTable.PSVersion
            Install-Module Pester -MinimumVersion 6.0.0 -Force -SkipPublisherCheck

      - name: Run Tests
        shell: pwsh
        run: |
          $env:PSModulePath = "${{ github.workspace }}\Modules;" + $env:PSModulePath
          Invoke-Pester -Path 'Tests' -Output Detailed

      - name: Leak check
        shell: pwsh
        run: |
          .\scripts\Invoke-LeakCheck.ps1

  release:
    name: GitHub release archive
    needs: pester
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build release archive
        id: archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          ARCHIVE="salmon-run-${VERSION}"
          # Exclude the private .git metadata and any stray runtime home.
          tar --exclude='.git' --exclude='.salmon' --exclude="${ARCHIVE}" \
              -czf "${ARCHIVE}.tar.gz" -C "${GITHUB_WORKSPACE}" .
          zip -r "${ARCHIVE}.zip" . -x '*.git*' -x '*.salmon*'
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Verify archive contents
        shell: bash
        run: |
          tar -tzf "salmon-run-${{ steps.archive.outputs.version }}.tar.gz" | grep -E '^\./(install\.ps1|Modules/|docs/|dot-salmon\.example/)' | head

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          VERSION="${{ steps.archive.outputs.version }}"
          gh release create "${VERSION}" \
            --title "salmon-run ${VERSION}" \
            --notes "Automated release archive for ${VERSION}." \
            "salmon-run-${VERSION}.tar.gz" \
            "salmon-run-${VERSION}.zip"
